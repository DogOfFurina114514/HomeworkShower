<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>账号已注销 · 作业</title>
    <link rel="icon" href="assets/icon.svg?v86" type="image/svg+xml" />
    <script src="assets/config.js?v86"></script>
    <!--
      注销相关页面：不加载 M3E、不加载 supabase，样式内联手写，
      任何浏览器都能打开；用 ?state=requested 区分"申请已提交"与"已注销"。
    -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f5fafc;
        color: #171d1e;
        font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      .card {
        width: 100%;
        max-width: 460px;
        padding: 30px 26px;
        border: 1px solid #bfc8cb;
        border-radius: 24px;
        background: #eff4f6;
        text-align: center;
      }
      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #cde7ed;
        color: #006877;
      }
      h1 { margin: 16px 0 12px; font-size: 22px; font-weight: 500; }
      p { margin: 0 0 10px; font-size: 15px; line-height: 1.75; color: #3f484a; word-break: break-word; }
      .muted { font-size: 13px; color: #6f797b; }
      .actions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      a.pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 42px;
        padding: 10px 22px;
        border-radius: 21px;
        background: #006877;
        color: #fff;
        font-size: 15px;
        text-decoration: none;
      }
      a.pill.ghost { background: transparent; color: #006877; }
    </style>
  </head>

  <body>
    <main class="card">
      <span class="icon" id="icon"></span>
      <h1 id="title">注销申请已提交</h1>
      <p id="line1"></p>
      <p id="line2"></p>
      <div class="actions">
        <a class="pill" id="go-home" href="./">回到主页</a>
        <a class="pill ghost" id="appeal" href="#">联系管理员</a>
      </div>
    </main>

    <script>
      /* ES5 写法；state=requested 表示"刚提交注销申请"，否则视为"账号已注销" */
      (function () {
        var CONFIG = window.HOMEWORK_SHOWER_CONFIG || {};
        var adminEmail = CONFIG.adminEmail || "wu__20111229@outlook.com";
        var requested = String(location.search).indexOf("state=requested") >= 0;
        var notified = String(location.search).indexOf("notified=0") < 0;

        var SVG_MAIL =
          '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 7L4.2 6h15.6L12 11zm0 2.3L4 8.2V18h16V8.2l-8 5.1z"/></svg>';

        document.getElementById("icon").innerHTML = SVG_MAIL;

        if (requested) {
          document.getElementById("title").innerHTML = "注销申请已提交";
          document.getElementById("line1").innerHTML =
            "你已经从所有设备退出登录，账号将在 <strong>3 天后</strong>进入已注销状态。";
          document.getElementById("line2").innerHTML =
            "在进入已注销状态之前，只要再用这个账号登录一次，注销就会自动取消 —— 我们随时欢迎你回来。";
        } else {
          document.getElementById("title").innerHTML = "账号已注销";
          document.getElementById("line1").innerHTML = "这个账号已经注销，无法再登录使用。";
          document.getElementById("line2").innerHTML =
            "数据会在保留期结束后删除。如果你认为这是一次误操作，或者想申请恢复，请联系管理员。";
        }

        var origin = location.origin || location.protocol + "//" + location.host;
        var parts = location.pathname.split("/").filter(function (item) { return !!item; });
        var home = origin + "/" + (parts[0] || "") + "/";
        document.getElementById("go-home").setAttribute("href", home);
        document.getElementById("admin-mail").textContent = "管理员邮箱：" + adminEmail + "（按钮打不开邮件应用时，请手动发送到这个地址）";
        var mailBox = document.createElement("p");
        mailBox.className = "muted";
        mailBox.id = "admin-mail";
        mailBox.style.userSelect = "text";
        mailBox.style.webkitUserSelect = "text";
        mailBox.style.wordBreak = "break-all";
        document.querySelector(".actions").parentNode.insertBefore(mailBox, document.querySelector(".actions"));
        document.getElementById("appeal").setAttribute(
          "href",
          "mailto:" + adminEmail + "?subject=" + encodeURIComponent(requested ? "取消注销申请" : "账号注销申诉")
        );
      })();
    </script>
  </body>
</html>
