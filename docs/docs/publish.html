<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>发布作业</title>
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  </head>

  <body>
    <header class="topbar">
      <div class="topbar__title">发布作业</div>
      <div class="topbar__controls">
        <a class="text" href="index.html">返回看板</a>
      </div>
    </header>

    <main class="publish">
      <p class="status" id="gate" hidden>只有「发布者」或「管理员」可以发布作业，当前账号没有这个权限。</p>

      <form id="publish-form" class="field" hidden>
        <p class="hint">
          在桌面端 StickyHomeworks2 里用「保存作业 → JSON」导出文件，然后在下面导入并选择它归属的日期。
          同一天重复发布会覆盖当天记录。
        </p>

        <p class="status" id="message" hidden></p>

        <div class="publish__row">
          <div class="field">
            <label for="publish-date">归属日期</label>
            <input type="date" id="publish-date" required />
          </div>
          <div class="field">
            <label for="publish-file">选择导出的 JSON 文件</label>
            <input type="file" id="publish-file" accept="application/json,.json" />
          </div>
        </div>

        <div class="field">
          <label for="publish-json">或直接粘贴 JSON</label>
          <textarea id="publish-json" spellcheck="false" placeholder='{"format":"stickyhomeworks2.homeworks", ...}'></textarea>
        </div>

        <p class="status" id="preview" hidden></p>

        <div class="publish__row">
          <button type="submit" class="primary" id="publish-submit">发布到这一天</button>
        </div>
      </form>
    </main>

    <script src="vendor/supabase.js"></script>
    <script src="assets/config.js"></script>
    <script src="assets/client.js"></script>
    <script src="assets/publish.js"></script>
  </body>
</html>
