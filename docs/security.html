<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>安全中心 · 作业</title>
    <script>
      /* 启动遮罩：组件就绪后再显示，避免样式露馅 */
      (function () {
        var root = document.documentElement;
        root.className += " hs-booting";
        function ready() { root.className = root.className.replace(/\s*hs-booting/, ""); }
        var tries = 0;
        (function wait() {
          if (window.customElements && window.customElements.get("m3e-dialog")) { ready(); return; }
          if (++tries > 40) { ready(); return; }
          window.setTimeout(wait, 100);
        })();
      })();
    </script>
    <script>
      /* 老浏览器检测：不支持则切到简版对应页面 */
      (function () {
        if (location.search.indexOf("full=1") >= 0) return;
        var ok = false;
        try {
          ok = typeof window.Proxy !== "undefined" &&
            typeof window.customElements !== "undefined" &&
            typeof HTMLElement !== "undefined" &&
            typeof HTMLElement.prototype.attachInternals === "function" &&
            typeof CSSStyleSheet !== "undefined" &&
            typeof CSSStyleSheet.prototype.replaceSync === "function" &&
            "adoptedStyleSheets" in Document.prototype;
        } catch (error) { ok = false; }
        if (ok) return;
        if (location.pathname.indexOf("/simple/") >= 0) return;
        var name = location.pathname.replace(/.*\//, "") || "security.html";
        location.replace(location.pathname.replace(/[^/]*$/, "") + "unsupport.html?page=" + encodeURIComponent(name));
      })();
    </script>
    <link rel="stylesheet" href="assets/app.css?v60" />
    <link rel="icon" href="assets/icon.svg?v60" type="image/svg+xml" />
    <script src="vendor/m3e.js?v60" defer></script>
    <script src="vendor/supabase.js?v60" defer></script>
    <script src="assets/config.js?v60" defer></script>
    <script src="assets/client.js?v60" defer></script>
    <script src="assets/security.js?v60" defer></script>
  </head>

  <body>
    <m3e-theme color="#22D1EC" scheme="auto" motion="expressive" strong-focus>
      <header class="topbar">
        <m3e-heading class="topbar__title" variant="title" size="large" level="1">安全中心</m3e-heading>
        <div class="topbar__controls">
          <m3e-button variant="text" id="back-button">
            <m3e-icon variant="outlined" slot="icon" name="arrow_back"></m3e-icon>
            返回看板
          </m3e-button>
        </div>
      </header>

      <main class="publish">
        <p class="status" id="status">当前账号：<strong id="account-email">—</strong></p>

        <section class="auth__card">
          <m3e-heading variant="title" size="large" level="2">更改邮箱</m3e-heading>
          <p class="hint">
            为防止账号被盗，更改邮箱需要邮箱验证：提交后系统会向<strong>新邮箱</strong>发送确认邮件，
            点开确认后才会生效。在确认完成之前，当前邮箱仍然可用。
          </p>

          <m3e-form-field variant="outlined">
            <label slot="label" for="current-email">当前邮箱（旧）</label>
            <input id="current-email" readonly />
          </m3e-form-field>

          <m3e-form-field variant="outlined">
            <label slot="label" for="new-email">新邮箱</label>
            <input id="new-email" type="email" autocomplete="email" />
          </m3e-form-field>

          <p class="status" id="email-message" hidden></p>
          <p class="status" id="email-pending" hidden></p>

          <div class="auth__actions">
            <m3e-button variant="filled" id="change-email">发送验证邮件到新邮箱</m3e-button>
            <m3e-button variant="text" id="resend-email" hidden>重新发送验证邮件</m3e-button>
          </div>

          <p class="hint">旧邮箱已经无法登录、收不到验证邮件？</p>
          <div class="auth__actions">
            <m3e-button variant="text" id="appeal">旧邮箱不可用，去申诉</m3e-button>
          </div>
        </section>

        <section class="auth__card">
          <m3e-heading variant="title" size="large" level="2">更改密码</m3e-heading>
          <p class="hint">
            同样需要邮箱验证：提交后会向你的邮箱发送确认邮件，点开邮件里的链接即可设置新密码。
          </p>

          <m3e-form-field variant="outlined">
            <label slot="label" for="new-password">新密码（至少 8 位）</label>
            <input id="new-password" type="password" autocomplete="new-password" />
          </m3e-form-field>

          <m3e-form-field variant="outlined">
            <label slot="label" for="confirm-password">确认新密码</label>
            <input id="confirm-password" type="password" autocomplete="new-password" />
          </m3e-form-field>

          <p class="status" id="password-message" hidden></p>

          <div class="auth__actions">
            <m3e-button variant="filled" id="change-password">发送验证邮件到当前邮箱</m3e-button>
          </div>
        </section>
      </main>
    </m3e-theme>

    <script>
      document.getElementById("back-button").addEventListener("click", function () {
        location.assign("index.html");
      });
    </script>
  </body>
</html>
