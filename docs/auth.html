<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>邮箱验证 · 作业</title>
    <link rel="stylesheet" href="assets/app.css?v22" />
    <link rel="icon" href="assets/icon.svg?v22" type="image/svg+xml" />
    <script>
      // 老浏览器（iOS Safari < 17.4、Chrome < 90）没有 ElementInternals.states（CSS 自定义状态），
      // M3E 组件内部会直接对它调 .add/.delete 从而抛 TypeError 导致组件崩掉。
      // 这里补一个最小实现（一个 Set），让组件能正常跑；不支持自定义状态的浏览器只是少了个状态选择器，
      // 组件自身的 class/属性逻辑不受影响。
      (function () {
        if (typeof Element === "undefined" || typeof Element.prototype.attachInternals !== "function") return;
        var original = Element.prototype.attachInternals;
        Element.prototype.attachInternals = function () {
          var internals = original.apply(this, arguments);
          try {
            if (internals && !internals.states) {
              Object.defineProperty(internals, "states", { value: new Set(), configurable: true });
            }
          } catch (error) {
            /* 实在补不上就算了，不影响其它功能 */
          }
          return internals;
        };
      })();
    </script>
    <script src="vendor/m3e.js?v23" defer></script>
    <script src="vendor/supabase.js?v22" defer></script>
    <script src="assets/config.js?v22" defer></script>
    <script src="assets/client.js?v22" defer></script>
    <script src="assets/auth.js?v22" defer></script>
  </head>

  <body>
    <m3e-theme color="#22D1EC" scheme="auto" motion="expressive" strong-focus>
      <main class="auth">
        <section class="auth__card">
          <m3e-heading variant="headline" size="small" level="1" id="auth-title">邮箱验证</m3e-heading>
          <p class="hint" id="auth-hint">正在读取验证结果…</p>
          <p class="status" id="auth-message" hidden></p>
          <div class="auth__actions">
            <m3e-button variant="filled" id="auth-continue">进入作业看板</m3e-button>
          </div>
          <div class="auth__actions" id="auth-resend-box" hidden>
            <m3e-form-field variant="outlined">
              <label slot="label" for="auth-resend-email">注册时用的邮箱</label>
              <input id="auth-resend-email" type="email" autocomplete="email" />
            </m3e-form-field>
            <m3e-button variant="text" id="auth-resend-button">重新发送验证邮件</m3e-button>
          </div>
        </section>
      </main>
    </m3e-theme>
  </body>
</html>
