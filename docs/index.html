<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>作业</title>
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  </head>

  <body>
    <header class="topbar">
      <div class="topbar__title" id="site-title">作业</div>
      <div class="topbar__controls">
        <input type="date" id="date-picker" aria-label="选择日期" />
        <button type="button" class="tonal" id="today-button">最新</button>
        <div class="account">
          <button type="button" class="tonal" id="account-button" aria-haspopup="true">个人中心</button>
          <div class="account__panel" id="account-panel" hidden>
            <div class="account__meta">
              <strong id="account-email">—</strong>
              <span>当前身份</span>
            </div>
            <span class="role-chip" id="account-role">用户</span>
            <a class="text" id="publish-link" href="publish.html" hidden>发布作业</a>
            <button type="button" class="text" id="logout-button">退出登录</button>
          </div>
        </div>
      </div>
    </header>

    <p class="status" id="status" hidden></p>

    <main class="board" id="board">
      <div class="empty-state"><div>正在加载…</div></div>
    </main>

    <script src="vendor/supabase.js"></script>
    <script src="assets/config.js"></script>
    <script src="assets/client.js"></script>
    <script src="assets/board.js"></script>
  </body>
</html>
