<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>作业</title>
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <script src="vendor/m3e.js" defer></script>
    <script src="vendor/m3e-icons.js" defer></script>
    <script src="vendor/supabase.js" defer></script>
    <script src="assets/config.js" defer></script>
    <script src="assets/client.js" defer></script>
    <script src="assets/board.js" defer></script>
  </head>

  <body>
    <m3e-theme color="#22D1EC" scheme="auto" motion="expressive" strong-focus>
      <header class="topbar">
        <m3e-heading class="topbar__title" variant="title" size="large" level="1" id="site-title">作业</m3e-heading>
        <div class="topbar__controls">
          <m3e-button variant="tonal" id="timemachine-button">
            <m3e-icon slot="icon" name="schedule"></m3e-icon>
            时光机
          </m3e-button>
          <div class="account">
            <m3e-button variant="tonal" id="account-button" aria-haspopup="true">
              <m3e-icon slot="icon" name="account_circle"></m3e-icon>
              <span id="account-button-label">个人中心</span>
            </m3e-button>
            <div class="account__panel" id="account-panel" hidden>
              <div class="account__meta">
                <strong id="account-email">—</strong>
                <span>当前身份</span>
              </div>
              <span class="role-chip" id="account-role">用户</span>
              <m3e-button variant="text" id="publish-link" hidden>发布作业</m3e-button>
              <m3e-button variant="text" id="logout-button">退出登录</m3e-button>
            </div>
          </div>
        </div>
      </header>

      <div class="banner" id="login-banner" hidden>
        <span class="banner__text">还没有登录：登录后可以用时光机查看以前的作业，也才能发布或修改（仅限当天）。</span>
        <m3e-button variant="filled" id="banner-login-button">登录 / 注册</m3e-button>
      </div>

      <p class="status" id="status" hidden></p>

      <main class="homework-board" id="board">
        <div class="homework-empty-state"><m3e-icon name="hourglass_top"></m3e-icon><span>正在加载…</span></div>
      </main>
    </m3e-theme>
  </body>
</html>
