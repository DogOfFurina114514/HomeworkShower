<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>登录 · 作业</title>
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  </head>

  <body>
    <main class="auth">
      <section class="auth__card">
        <h1>作业</h1>
        <p class="hint">登录后即可查看每天的作业。账号使用邮箱注册，注册后需要点开验证邮件完成验证。</p>

        <div class="auth__tabs">
          <button type="button" id="tab-login" class="primary">登录</button>
          <button type="button" id="tab-register">注册</button>
        </div>

        <p class="status" id="message" hidden></p>

        <form id="login-form" class="field" autocomplete="on">
          <div class="field">
            <label for="login-email">邮箱</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="login-password">密码</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="primary">登录</button>
        </form>

        <form id="register-form" class="field" autocomplete="on" hidden>
          <div class="field">
            <label for="register-email">邮箱</label>
            <input id="register-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="register-password">密码（至少 8 位）</label>
            <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
          </div>
          <div class="field">
            <label for="register-confirm">确认密码</label>
            <input id="register-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required />
          </div>
          <button type="submit" class="primary">注册并发送验证邮件</button>
        </form>

        <div class="field" id="resend-box" hidden>
          <label for="resend-email">没收到验证邮件？</label>
          <input id="resend-email" type="email" placeholder="填写注册邮箱" />
          <button type="button" class="text" id="resend-button">重新发送验证邮件</button>
        </div>
      </section>
    </main>

    <script src="vendor/supabase.js"></script>
    <script src="assets/config.js"></script>
    <script src="assets/client.js"></script>
    <script src="assets/login.js"></script>
  </body>
</html>
