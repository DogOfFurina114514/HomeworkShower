# 让 Supabase 免费项目保持活跃：免费计划闲置 7 天会被自动暂停，
# 这里每 3 天打一次只读接口（用公开的 publishable key，不需要任何密钥）。
name: keepalive

on:
  schedule:
    - cron: "0 4 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase（只读请求，唤醒数据库）
        run: |
          set -e
          URL="https://kmzcebxhewlihgqzfaqw.supabase.co/rest/v1/publish_batches?select=published_on&limit=1"
          KEY="sb_publishable_woB0DFosxaxHE1101sjfHA_Bt0SJMxG"
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL")
          echo "HTTP $code"
          cat /tmp/out.txt
          test "$code" = "200"
