<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>账号已注销 · 作业</title>
    <link rel="icon" href="assets/icon.svg?v103" type="image/svg+xml" />
    <script src="assets/config.js?v103"></script>
    <!--
      注销相关页面：不加载 M3E、不加载 supabase，样式内联手写，
      任何浏览器都能打开；用 ?state=requested 区分"申请已提交"与"已注销"。
    -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f5fafc;
        color: #171d1e;
        font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      .card {
        width: 100%;
        max-width: 460px;
        padding: 30px 26px;
        border: 1px solid #bfc8cb;
        border-radius: 24px;
        background: #eff4f6;
        text-align: center;
      }
      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #cde7ed;
        color: #006877;
      }
      h1 { margin: 16px 0 12px; font-size: 22px; font-weight: 500; }
      p { margin: 0 0 10px; font-size: 15px; line-height: 1.75; color: #3f484a; word-break: break-word; }
      .muted { font-size: 13px; color: #6f797b; }
      .actions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      a.pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 42px;
        padding: 10px 22px;
        border-radius: 21px;
        background: #006877;
        color: #fff;
        font-size: 15px;
        text-decoration: none;
      }
      a.pill.ghost { background: transparent; color: #006877; }
    </style>
  </head>

  <body>
    <main class="card">
      <span class="icon" id="icon"></span>
      <h1 id="title">注销申请已提交</h1>
      <p id="line1"></p>
      <p id="line2"></p>
      <div class="actions">
        <a class="pill" id="go-home" href="./">回到主页</a>
        <a class="pill ghost" id="appeal" href="#">联系管理员</a>
      </div>
    </main>

    <script>
      /* ES5 写法；state=requested 表示"刚提交注销申请"，否则视为"账号已注销" */
      (function () {
        var CONFIG = window.HOMEWORK_SHOWER_CONFIG || {};
        var adminEmail = CONFIG.adminEmail || "wu__20111229@outlook.com";
        var requested = String(location.search).indexOf("state=requested") >= 0;
        var notified = String(location.search).indexOf("notified=0") < 0;

        // 通知邮件失败的具体原因（由 security.js 带过来）。
        // 这页不加载 client.js，所以自己解析 query，并做 HTML 转义 ——
        // 原因是后端错误文案，不转义直接 innerHTML 会有注入风险。
        var mailReason = "";
        try {
          var matched = /[?&]reason=([^&]+)/.exec(String(location.search));
          mailReason = matched ? decodeURIComponent(matched[1]) : "";
        } catch (ignored) {
          mailReason = "";
        }
        var esc = function (value) {
          return String(value || "").replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        };

        var SVG_MAIL =
          '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 7L4.2 6h15.6L12 11zm0 2.3L4 8.2V18h16V8.2l-8 5.1z"/></svg>';

        document.getElementById("icon").innerHTML = SVG_MAIL;

        if (requested) {
          document.getElementById("title").innerHTML = "注销申请已提交";
          document.getElementById("line1").innerHTML =
            "你已经从所有设备退出登录，账号将在 <strong>3 天后</strong>进入已注销状态。";
          document.getElementById("line2").innerHTML =
            "在进入已注销状态之前，只要再用这个账号登录一次，注销就会自动取消 —— 我们随时欢迎你回来。";
          // 通知邮件没发出去要明说：否则用户以为邮箱里会有一封"可随时取消"的信，
          // 一直等，错过 3 天窗口。原来 notified 变量取出来了却没人用。
          if (!notified) {
            var warn = document.createElement("p");
            warn.className = "muted";
            warn.style.color = "var(--danger, #ba1a1a)";
            // 有具体原因就用具体原因（后端返回的），没有再退回通用猜测。
            // mailReason 走 esc() 转义，不让后端文案里的尖括号被当成标签。
            var cause = mailReason
              ? "原因：" + esc(mailReason)
              : "可能是邮箱解析失败、邮箱不存在或地址不可用。";
            warn.innerHTML =
              "注意：<strong>通知邮件没能发送成功</strong>（" + cause + "）" +
              "所以你不会收到带取消链接的邮件。要反悔请直接<strong>用这个账号再登录一次</strong>，" +
              "或按下方地址联系管理员。";
            document.getElementById("line2").parentNode.insertBefore(warn, document.getElementById("line2").nextSibling);
          }
        } else {
          document.getElementById("title").innerHTML = "账号已注销";
          document.getElementById("line1").innerHTML = "这个账号已经注销，无法再登录使用。";
          document.getElementById("line2").innerHTML =
            "数据会在保留期结束后删除。如果你认为这是一次误操作，或者想申请恢复，请联系管理员。";
        }

        var origin = location.origin || location.protocol + "//" + location.host;
        /* 首页 = 当前页面所在目录。
           原来用 pathname 第一段（/HomeworkShower/deleted.html → /HomeworkShower/），
           但自定义域名下站点在根，第一段会变成 "deleted" / "deleted.html"，
           「回到首页」就指到 /deleted/ 这种不存在的地方去了。 */
        var home = origin + location.pathname.replace(/[^\/]*$/, "");
        document.getElementById("go-home").setAttribute("href", home);
        var mailBox = document.createElement("p");
        mailBox.className = "muted";
        mailBox.id = "admin-mail";
        mailBox.style.userSelect = "text";
        mailBox.style.webkitUserSelect = "text";
        mailBox.style.wordBreak = "break-all";
        document.querySelector(".actions").parentNode.insertBefore(mailBox, document.querySelector(".actions"));
        // 原来这行写在 mailBox 创建之前，取不到元素直接抛错，
        // 导致下面 appeal 的 mailto 从来没被设置过（按钮点了没反应）。
        mailBox.textContent = "管理员邮箱：" + adminEmail + "（按钮打不开邮件应用时，请手动发送到这个地址）";
        document.getElementById("appeal").setAttribute(
          "href",
          "mailto:" + adminEmail + "?subject=" + encodeURIComponent(requested ? "取消注销申请" : "账号注销申诉")
        );
      })();
    </script>
  </body>
</html>
